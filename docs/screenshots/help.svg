<svg xmlns="http://www.w3.org/2000/svg" width="906" height="890" viewBox="0 0 906 890" font-family="'Cascadia Mono','JetBrains Mono',Consolas,Menlo,monospace" font-size="14">
<rect width="100%" height="100%" rx="10" fill="#020202" stroke="#1f1f1f"/>
<path d="M10 0 H896 a10 10 0 0 1 10 10 V30 H0 V10 a10 10 0 0 1 10 -10 Z" fill="#0d0d0d"/><rect y="30" width="100%" height="1" fill="#1f1f1f"/>
<circle cx="18" cy="15" r="5" fill="#3a3a3a"/><circle cx="34" cy="15" r="5" fill="#3a3a3a"/><circle cx="50" cy="15" r="5" fill="#ff3333"/><text x="453" y="19.5" fill="#6b6b6b" font-size="12" text-anchor="middle">jedkx-cli · keys</text>
<text x="24.4" y="59.0" fill="#f5f5f5" font-weight="700" xml:space="preserve">jedkx-cli</text>
<text x="100.0" y="59.0" fill="#6b6b6b" xml:space="preserve">  keys</text>
<text x="24.4" y="95.0" fill="#6b6b6b" xml:space="preserve">OPEN</text>
<text x="32.8" y="113.0" fill="#ff3333" font-weight="700" xml:space="preserve">enter  </text>
<text x="91.6" y="113.0" fill="#bdbdbd" xml:space="preserve">open beside the list (resize: alt+shift+← →)</text>
<text x="32.8" y="131.0" fill="#ff3333" font-weight="700" xml:space="preserve">o      </text>
<text x="91.6" y="131.0" fill="#bdbdbd" xml:space="preserve">open here, full screen</text>
<text x="32.8" y="149.0" fill="#ff3333" font-weight="700" xml:space="preserve">t      </text>
<text x="91.6" y="149.0" fill="#bdbdbd" xml:space="preserve">open in a new tab</text>
<text x="32.8" y="167.0" fill="#ff3333" font-weight="700" xml:space="preserve">n      </text>
<text x="91.6" y="167.0" fill="#bdbdbd" xml:space="preserve">new chat in the same folder, in a new tab</text>
<text x="32.8" y="185.0" fill="#ff3333" font-weight="700" xml:space="preserve">space  </text>
<text x="91.6" y="185.0" fill="#bdbdbd" xml:space="preserve">preview: the last messages of the chat</text>
<text x="32.8" y="203.0" fill="#ff3333" font-weight="700" xml:space="preserve">c      </text>
<text x="91.6" y="203.0" fill="#bdbdbd" xml:space="preserve">copy the resume command (paste it in any terminal)</text>
<text x="32.8" y="221.0" fill="#ff3333" font-weight="700" xml:space="preserve">e      </text>
<text x="91.6" y="221.0" fill="#bdbdbd" xml:space="preserve">export the whole chat as Markdown (Downloads)</text>
<text x="32.8" y="239.0" fill="#ff3333" font-weight="700" xml:space="preserve">tab    </text>
<text x="91.6" y="239.0" fill="#bdbdbd" xml:space="preserve">all · claude · codex · archived │ skills &amp; md</text>
<text x="24.4" y="275.0" fill="#6b6b6b" xml:space="preserve">SELECT</text>
<text x="32.8" y="293.0" fill="#ff3333" font-weight="700" xml:space="preserve">x      </text>
<text x="91.6" y="293.0" fill="#bdbdbd" xml:space="preserve">select a chat — on a project: the whole folder</text>
<text x="32.8" y="311.0" fill="#ff3333" font-weight="700" xml:space="preserve">ctrl+a </text>
<text x="91.6" y="311.0" fill="#bdbdbd" xml:space="preserve">select everything in view (again: clear)</text>
<text x="32.8" y="329.0" fill="#ff3333" font-weight="700" xml:space="preserve">d a p e</text>
<text x="91.6" y="329.0" fill="#bdbdbd" xml:space="preserve">delete · archive · pin · export the selected</text>
<text x="32.8" y="347.0" fill="#ff3333" font-weight="700" xml:space="preserve">esc    </text>
<text x="91.6" y="347.0" fill="#bdbdbd" xml:space="preserve">clear the selection</text>
<text x="32.8" y="365.0" fill="#ff3333" font-weight="700" xml:space="preserve">f      </text>
<text x="91.6" y="365.0" fill="#bdbdbd" xml:space="preserve">open the project folder</text>
<text x="24.4" y="401.0" fill="#6b6b6b" xml:space="preserve">PANES (WINDOWS TERMINAL)</text>
<text x="32.8" y="419.0" fill="#ff3333" font-weight="700" xml:space="preserve">alt+shift+← →</text>
<text x="142.0" y="419.0" fill="#bdbdbd" xml:space="preserve">make this panel wider / narrower</text>
<text x="32.8" y="437.0" fill="#ff3333" font-weight="700" xml:space="preserve">alt+← →</text>
<text x="91.6" y="437.0" fill="#bdbdbd" xml:space="preserve">jump between the list and a chat</text>
<text x="32.8" y="455.0" fill="#ff3333" font-weight="700" xml:space="preserve">ctrl+shift+w</text>
<text x="133.6" y="455.0" fill="#bdbdbd" xml:space="preserve">close the focused pane</text>
<text x="24.4" y="491.0" fill="#6b6b6b" xml:space="preserve">LIST</text>
<text x="32.8" y="509.0" fill="#ff3333" font-weight="700" xml:space="preserve">↑ ↓    </text>
<text x="91.6" y="509.0" fill="#bdbdbd" xml:space="preserve">move  (pgup pgdn g G jump)</text>
<text x="32.8" y="527.0" fill="#ff3333" font-weight="700" xml:space="preserve">← →    </text>
<text x="91.6" y="527.0" fill="#bdbdbd" xml:space="preserve">fold / unfold the project group</text>
<text x="32.8" y="545.0" fill="#ff3333" font-weight="700" xml:space="preserve">z      </text>
<text x="91.6" y="545.0" fill="#bdbdbd" xml:space="preserve">fold or unfold all groups</text>
<text x="32.8" y="563.0" fill="#ff3333" font-weight="700" xml:space="preserve">v      </text>
<text x="91.6" y="563.0" fill="#bdbdbd" xml:space="preserve">group by project ⇄ flat list</text>
<text x="32.8" y="581.0" fill="#ff3333" font-weight="700" xml:space="preserve">s      </text>
<text x="91.6" y="581.0" fill="#bdbdbd" xml:space="preserve">sort: recent → name → project → size</text>
<text x="32.8" y="599.0" fill="#ff3333" font-weight="700" xml:space="preserve">/      </text>
<text x="91.6" y="599.0" fill="#bdbdbd" xml:space="preserve">search · esc clears</text>
<text x="32.8" y="617.0" fill="#ff3333" font-weight="700" xml:space="preserve">ctrl+f </text>
<text x="91.6" y="617.0" fill="#bdbdbd" xml:space="preserve">while searching: look inside every chat&#39;s messages</text>
<text x="24.4" y="653.0" fill="#6b6b6b" xml:space="preserve">SESSION</text>
<text x="32.8" y="671.0" fill="#ff3333" font-weight="700" xml:space="preserve">p      </text>
<text x="91.6" y="671.0" fill="#bdbdbd" xml:space="preserve">pin</text>
<text x="32.8" y="689.0" fill="#ff3333" font-weight="700" xml:space="preserve">r      </text>
<text x="91.6" y="689.0" fill="#bdbdbd" xml:space="preserve">rename (only here; tool files untouched)</text>
<text x="32.8" y="707.0" fill="#ff3333" font-weight="700" xml:space="preserve">a      </text>
<text x="91.6" y="707.0" fill="#bdbdbd" xml:space="preserve">archive · the archived tab shows them (a again: back)</text>
<text x="32.8" y="725.0" fill="#ff3333" font-weight="700" xml:space="preserve">d      </text>
<text x="91.6" y="725.0" fill="#bdbdbd" xml:space="preserve">delete for good (asks y/n)</text>
<text x="24.4" y="761.0" fill="#6b6b6b" xml:space="preserve">OTHER</text>
<text x="32.8" y="779.0" fill="#ff3333" font-weight="700" xml:space="preserve">ctrl+r </text>
<text x="91.6" y="779.0" fill="#bdbdbd" xml:space="preserve">refresh (also automatic when you come back to the list)</text>
<text x="32.8" y="797.0" fill="#ff3333" font-weight="700" xml:space="preserve">q esc  </text>
<text x="91.6" y="797.0" fill="#bdbdbd" xml:space="preserve">quit</text>
<text x="24.4" y="833.0" fill="#6b6b6b" xml:space="preserve">? or esc to go back</text>
</svg>
